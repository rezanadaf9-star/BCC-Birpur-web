name: Deploy Firebase backend (rules, indexes, functions)
# Manual only, so nothing is deployed by accident. Needs the repository secret FIREBASE_SERVICE_ACCOUNT
# (a service-account JSON with the roles listed in docs/SETUP.md) and the variable FIREBASE_PROJECT_ID.
on: { workflow_dispatch: {} }
permissions: { contents: read, id-token: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm --prefix functions install
      - uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
      - run: npx firebase-tools deploy --only firestore,storage,functions --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
